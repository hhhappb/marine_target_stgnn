paths:
  data_dir: data/sdrdsp_strict_256_p32_v1
  save_dir: logs/training/20260721-171100_sdrdsp_lag_aware_anti_alias_tfe_both_p32_n256_gamma0_seed42
dataset:
  type: scr_npz
  data_dir: data/sdrdsp_strict_256_p32_v1
  protocol: sdrdsp_fig9_local_crop_v2
  normalization: none
model:
  name: sfe_replacement_stgnn
  pulses: 32
  range_cells: 256
radar_features:
  type: real_imag
  hidden_channels: 32
  out_channels: 64
spatial_graph:
  type: original_stfe
  stage1_out_channels: 128
  stage2_out_channels: 512
temporal:
  type: stgnn_tfe
  stage1_out_channels: 256
  stage2_out_channels: 1024
  out_channels: 1024
temporal1:
  type: lag_aware_anti_alias_tfe
  stage1_out_channels: 256
  kernel_size: 3
  filter_groups: 1
  gamma_init: 0.05
  gamma_max: 1.0
  use_filter: false
  padding_mode: replicate
temporal2:
  type: lag_aware_anti_alias_tfe
  stage2_out_channels: 1024
  out_channels: 1024
  kernel_size: 3
  filter_groups: 1
  gamma_init: 0.05
  gamma_max: 1.0
  use_filter: false
  padding_mode: replicate
clutter_gate:
  enabled: false
detection_head:
  hidden_channels: 512
loss:
  type: cross_entropy
  use_class_weights: false
diagnostics:
  temporal: true
train:
  epochs: 10
  batch_size: 24
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0
  scheduler: none
  grad_clip: null
  num_workers: 0
  seed: 42
eval:
  protocol: pd_scr_curve
  threshold_source: train
  score_space: logit_margin
  pfa_values: [0.0001, 0.001, 0.01]
