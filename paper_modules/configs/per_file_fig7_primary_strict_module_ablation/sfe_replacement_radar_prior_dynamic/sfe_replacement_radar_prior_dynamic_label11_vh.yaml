experiment:
  protocol_family: diagnostic
  protocol_version: ipix_primary_strict_module_ablation_v1
  question: 仅替换空间 SFE 是否改善 primary_strict IPIX 检测
paths:
  data_dir: datasets/ipix_dartmouth/processed/window4_stride4_related_official_ipixload_auto_double
  save_dir: logs/training/per_file_fig7_primary_strict_module_ablation/sfe_replacement_radar_prior_dynamic/label11_vh
dataset:
  type: ipix_window
  data_dir: datasets/ipix_dartmouth/processed/window4_stride4_related_official_ipixload_auto_double
  expected_processing_mode: official_ipixload_auto
  sources:
  - 19931118_035737_stareC0000
  polarizations:
  - vh
  train_label_policy: primary_strict
  evaluation_label_policy: primary_strict
ipix:
  polarizations:
  - vh
model:
  name: sfe_replacement_stgnn
  pulses: 4
  range_cells: 14
loss:
  type: cross_entropy
  use_class_weights: false
train:
  epochs: 60
  batch_size: 512
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0
  scheduler: none
  grad_clip: null
  num_workers: 0
  seed: 42
eval:
  protocol: per_file_pol
  threshold_source: train_clutter
  pfa_values:
  - 0.001
radar_features:
  type: real_imag
  hidden_channels: 32
  out_channels: 64
spatial_graph:
  type: radar_prior_dynamic_sfe
  stage1_out_channels: 128
  stage2_out_channels: 512
  static_gamma: 0.5
  static_delta: 5
  static_weight: 0.7
  dynamic_topk: 2
  dynamic_temperature: 0.2
  dropout: 0.1
temporal:
  type: stgnn_tfe
  stage1_out_channels: 256
  stage2_out_channels: 1024
  out_channels: 1024
clutter_gate:
  enabled: false
detection_head:
  hidden_channels: 512
